name: Task
description: Non-feature work — refactor, cleanup, upgrade, docs
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done?
      description: A clear description of the task.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2

  - type: textarea
    id: context
    attributes:
      label: Additional context
