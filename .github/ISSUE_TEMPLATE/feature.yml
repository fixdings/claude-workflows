name: Feature Request
description: Propose a new feature or enhancement
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why is it needed?
      placeholder: As a [role], I need [capability] so that [benefit].
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Any API, UX, or data-model implications?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've considered, and why you ruled them out.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, references, or examples.
